<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    .x1 { animation: axXShift 4s ease-in-out infinite; }
    @keyframes axXShift { 0%, 100% { stroke: #5BEA99; } 50% { stroke: #D8FFE7; } }
    .pt { animation: axPulse 3.6s ease-in-out infinite; }
    @keyframes axPulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .x1 { animation: none; stroke: #5BEA99; }
      .pt { animation: none; opacity: .8; }
    }
  </style>

  <!-- A — restrained structural monogram half, deep green -->
  <path d="M3 28 L10 3" stroke="#123D27" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M10 3 L17 28" stroke="#123D27" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M6.2 18 L14.4 18" stroke="#123D27" stroke-width="3.4" stroke-linecap="round" fill="none"/>

  <!-- X — the AlterX signal, emerald, close enough to the A to read as one AX mark -->
  <path class="x1" d="M14 3 L29 28" stroke="#5BEA99" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M29 3 L14 28" stroke="#9FFFC0" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- tiny particle accents at the X crossing -->
  <circle class="pt" cx="21.5" cy="15.5" r="1.3" fill="#D8FFE7" style="animation-delay:0s"/>
  <circle class="pt" cx="24.2" cy="19.5" r="1" fill="#D8FFE7" style="animation-delay:.9s"/>
  <circle class="pt" cx="19" cy="12" r="0.9" fill="#D8FFE7" style="animation-delay:1.8s"/>
</svg>
